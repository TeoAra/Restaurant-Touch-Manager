openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: POS Restaurant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Menu categories
  - name: products
    description: Menu products/items
  - name: tables
    description: Restaurant tables
  - name: orders
    description: Orders management
  - name: orderItems
    description: Order items
  - name: payments
    description: Payments
  - name: dashboard
    description: Dashboard and reports
  - name: marginality
    description: Restaurant profitability analysis and costing
  - name: kitchen
    description: Kitchen display board, item lifecycle management, and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Categories
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Tables
  /tables:
    get:
      operationId: listTables
      tags: [tables]
      summary: List all tables
      responses:
        "200":
          description: List of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      operationId: createTable
      tags: [tables]
      summary: Create a table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableBody"
      responses:
        "201":
          description: Created table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"

  /tables/{id}:
    get:
      operationId: getTable
      tags: [tables]
      summary: Get table by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Not found
    patch:
      operationId: updateTable
      tags: [tables]
      summary: Update table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableBody"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
    delete:
      operationId: deleteTable
      tags: [tables]
      summary: Delete table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
            enum: ["open", "paid", "cancelled", null]
        - name: tableId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Cancel order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Order Items
  /orders/{orderId}/items:
    get:
      operationId: listOrderItems
      tags: [orderItems]
      summary: List items for an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderItem"
    post:
      operationId: addOrderItem
      tags: [orderItems]
      summary: Add item to order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrderItemBody"
      responses:
        "201":
          description: Added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"

  /orders/{orderId}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orderItems]
      summary: Update order item quantity or notes
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
    delete:
      operationId: deleteOrderItem
      tags: [orderItems]
      summary: Remove item from order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # Payments
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Register a payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # Dashboard / Reports
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Daily revenue summary and stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales-by-day:
    get:
      operationId: getSalesByDay
      tags: [dashboard]
      summary: Sales totals grouped by day (default last 30 days)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Sales by day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesByDay"

  /dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [dashboard]
      summary: Top selling products
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /dashboard/tables-status:
    get:
      operationId: getTablesStatus
      tags: [dashboard]
      summary: Current status of all tables with active order info
      responses:
        "200":
          description: Tables with status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableStatus"

  /marginality/overview:
    get:
      operationId: getMarginOverview
      tags: [marginality]
      summary: Get profitability overview for a period
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Profitability overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginOverview"

  /marginality/orders/{orderId}:
    get:
      operationId: getMarginOrder
      tags: [marginality]
      summary: Get the most recent immutable profitability snapshot for an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Profitability snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginOrderSnapshot"
        "404": { description: No calculation available }

  /marginality/orders/{orderId}/recalculate:
    post:
      operationId: recalculateMarginOrder
      tags: [marginality]
      summary: Enqueue an explicit new profitability calculation version
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "202":
          description: Recalculation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginRecalculation"

  /marginality/catalog:
    get:
      operationId: getMarginCatalog
      tags: [marginality]
      summary: Get costing setup data and menu products
      responses:
        "200":
          description: Costing catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginCatalog"

  /marginality/ingredients:
    post:
      operationId: createMarginIngredient
      tags: [marginality]
      summary: Create an ingredient and its current cost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginIngredientInput"
      responses:
        "201":
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginIngredient"

  /marginality/ingredients/{id}:
    patch:
      operationId: updateMarginIngredient
      tags: [marginality]
      summary: Update an ingredient current cost or status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginIngredientUpdate"
      responses:
        "200":
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginIngredient"

  /marginality/recipes:
    post:
      operationId: createMarginRecipe
      tags: [marginality]
      summary: Create a versioned recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginRecipeInput"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginRecipe"

  /marginality/configurations:
    post:
      operationId: createMarginConfiguration
      tags: [marginality]
      summary: Create a dated cost configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginCostConfigurationInput"
      responses:
        "201":
          description: Configuration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginCostConfiguration"

  /marginality/utility-bills:
    post:
      operationId: createMarginUtilityBill
      tags: [marginality]
      summary: Record a utility bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginUtilityBillInput"
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginUtilityBill"

  /marginality/utility-types:
    post:
      operationId: createMarginUtilityType
      tags: [marginality]
      summary: Create a utility type for bill tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginUtilityTypeInput"
      responses:
        "201":
          description: Utility type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginUtilityType"

  # Kitchen endpoints
  /kitchen/board:
    get:
      operationId: getKitchenBoard
      tags: [kitchen]
      summary: Kitchen display board — active orders with items, phases, modifiers, prep minutes
      responses:
        "200":
          description: Board data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitchenBoardOrder"
        "401":
          description: Unauthorized

  /kitchen/categories:
    get:
      operationId: getKitchenCategories
      tags: [kitchen]
      summary: List menu categories (no cost data)
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitchenCategory"

  /kitchen/products/{productId}/ingredients:
    get:
      operationId: getProductIngredients
      tags: [kitchen]
      summary: Get active recipe ingredients for a product (for automatic Senza modifiers)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingredient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitchenIngredient"

  /kitchen/items/{itemId}/status:
    patch:
      operationId: updateKitchenItemStatus
      tags: [kitchen]
      summary: Transition an order item status (sent→preparing→ready→delivered)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenStatusTransition"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenStatusResult"
        "409":
          description: Concurrent transition conflict
        "422":
          description: Invalid transition

  /kitchen/orders/{orderId}/start:
    post:
      operationId: kitchenBulkStart
      tags: [kitchen]
      summary: Bulk transition sent items to preparing for an order (optionally by phase)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenBulkPhaseInput"
      responses:
        "200":
          description: Items updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenBulkResult"

  /kitchen/orders/{orderId}/ready:
    post:
      operationId: kitchenBulkReady
      tags: [kitchen]
      summary: Bulk transition preparing items to ready for an order (optionally by phase)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenBulkPhaseInput"
      responses:
        "200":
          description: Items updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenBulkResult"

  /kitchen/analytics:
    get:
      operationId: getKitchenAnalytics
      tags: [kitchen]
      summary: Admin kitchen analytics — load, prep times, variance, delayed count (admin only)
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: productId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenAnalytics"
        "403":
          description: Admin only

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - color
        - sortOrder
        - createdAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
      required:
        - name
        - color
        - sortOrder

    Product:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: string
        available:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - price
        - available
        - sortOrder
        - createdAt

    CreateProductBody:
      type: object
      properties:
        categoryId:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: string
        available:
          type: boolean
        sortOrder:
          type: integer
      required:
        - name
        - price
        - available
        - sortOrder

    ProductVariation:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        name: { type: string }
        options: { type: string }
        required: { type: boolean }
        sortOrder: { type: integer }
      required: [id, productId, name, options, required, sortOrder]

    Table:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        name:
          type: string
        seats:
          type: integer
        status:
          type: string
          enum: ["free", "occupied", "reserved"]
        createdAt:
          type: string
      required:
        - id
        - number
        - name
        - seats
        - status
        - createdAt

    CreateTableBody:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        seats:
          type: integer
        status:
          type: string
          enum: ["free", "occupied", "reserved"]
      required:
        - number
        - name
        - seats
        - status

    UpdateTableBody:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        seats:
          type: integer
        status:
          type: string
          enum: ["free", "occupied", "reserved"]

    Order:
